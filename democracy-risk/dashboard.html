<style>

  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  .wrap{max-width:1080px;margin:0 auto;padding:36px 24px 80px;}

  .back{display:inline-block;margin-bottom:16px;font-family:var(--mono);font-size:12px;color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--muted);}

  header{border-bottom:1px solid var(--hair);padding-bottom:20px;margin-bottom:28px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
  h1{font-family:var(--serif);font-weight:600;font-size:26px;margin:4px 0 0;}
  .period{font-family:var(--mono);font-size:13px;color:var(--muted);}

  .empty{border:1px dashed var(--hair);border-radius:4px;padding:40px 24px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:13px;}

  .gauges{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--hair);border-radius:4px;overflow:hidden;margin-bottom:4px;}
  .gauge-panel{padding:28px 24px;background:var(--panel);position:relative;}
  .gauge-panel + .gauge-panel{border-left:1px solid var(--hair);}
  .gauge-label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;}
  .gauge-score{font-family:var(--mono);font-size:56px;font-weight:600;line-height:1;}
  .gauge-band{font-family:var(--sans);font-size:14px;margin-top:6px;font-weight:500;}
  .gauge-trend{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px;}
  .arc-wrap{position:absolute;top:24px;right:24px;width:96px;height:96px;}

  .gap-bar{border:1px solid var(--hair);border-top:none;background:var(--panel-alt);padding:16px 24px 20px;text-align:center;margin-bottom:32px;border-radius:0 0 4px 4px;}
  .gap-track{position:relative;height:8px;background:var(--hair);border-radius:4px;margin:14px 0 10px;overflow:hidden;}
  .gap-fill{position:absolute;top:0;height:100%;background:var(--muted);}
  .gap-mid{position:absolute;top:-4px;left:50%;width:1px;height:16px;background:var(--muted);opacity:.5;}
  .gap-label{font-family:var(--mono);font-size:12px;color:var(--muted);}
  .gap-value{font-family:var(--mono);font-weight:600;color:var(--ink);}
  .relationship-note{font-family:var(--serif);font-size:14px;color:var(--paper);margin-top:10px;max-width:640px;margin-left:auto;margin-right:auto;}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:32px;}
  @media (max-width:760px){.cols,.gauges{grid-template-columns:1fr;}}
  .col-title{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--hair);}
  .indicator{padding:11px 0;border-bottom:1px solid var(--hair);}
  .indicator:last-child{border-bottom:none;}
  .ind-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .ind-name{font-size:13px;font-weight:500;}
  .pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;padding:2px 8px;border-radius:10px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;}
  .ind-note{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45;}

  .section{margin-bottom:32px;}
  .section-title{font-family:var(--serif);font-size:16px;font-weight:600;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--hair);}
  .gate-list{list-style:none;margin:0;padding:0;}
  .gate-item{padding:10px 0;border-bottom:1px solid var(--hair);font-size:13px;}
  .gate-item:last-child{border-bottom:none;}
  .gate-item b{font-weight:600;}
  .gate-item .meta{color:var(--muted);font-size:12px;margin-top:3px;}
  .none-note{color:var(--muted);font-size:13px;font-family:var(--mono);}

  .trajectory{font-size:14px;line-height:1.7;color:var(--paper);}

  .history{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;}
  .history th,.history td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--hair);}
  .history th{color:var(--muted);font-weight:500;text-transform:uppercase;font-size:10.5px;letter-spacing:.06em;}
  .history tr:hover td{background:var(--panel-alt);}

  footer{margin-top:36px;padding-top:20px;border-top:1px solid var(--hair);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted);}
  footer a{color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--muted);}
  footer a:hover{color:var(--ink);}
</style>

const COLOR_MAP = {
  green: "var(--green)", darkgreen: "var(--darkgreen)", yellow: "var(--yellow)",
  amber: "var(--amber)", orange: "var(--orange)", red: "var(--red)"
};

function esc(s){ return (s ?? "").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function arcSVG(score, color){
  const r = 40, cx = 48, cy = 48, circumference = Math.PI * r;
  const pct = Math.max(0, Math.min(100, score)) / 100;
  const dash = circumference * pct;
  return `<svg width="96" height="96" viewBox="0 0 96 96">
    <path d="M 8 48 A 40 40 0 0 1 88 48" fill="none" stroke="var(--hair)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 8 48 A 40 40 0 0 1 88 48" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="${dash.toFixed(1)} ${circumference.toFixed(1)}"/>
  </svg>`;
}

function statusPill(status, arrow){
  const key = (status||"").toLowerCase();
  let bg = "var(--hair)", fg = "var(--muted)";
  if(["severe","failed"].includes(key)){bg="rgba(201,64,59,.18)";fg="var(--red)";}
  else if(["escalating","weak"].includes(key)){bg="rgba(217,98,43,.18)";fg="var(--orange)";}
  else if(["warning","mixed"].includes(key)){bg="rgba(201,162,39,.18)";fg="var(--yellow)";}
  else if(["stable","strong"].includes(key)){bg="rgba(76,154,106,.18)";fg="var(--green)";}
  else if(["very strong"].includes(key)){bg="rgba(47,107,69,.25)";fg="var(--darkgreen)";}
  return `<span class="pill" style="background:${bg};color:${fg}">${esc(status)} ${esc(arrow||"")}</span>`;
}

function gapInterpretation(gap){
  if(gap > 10) return "Resilience exceeds pressure";
  if(gap >= 0) return "Favorable balance";
  if(gap >= -10) return "Manageable strain";
  if(gap >= -20) return "Dangerous imbalance";
  return "Acute breakdown risk";
}
