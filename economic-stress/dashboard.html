<style>

  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  .wrap{max-width:1080px;margin:0 auto;padding:36px 24px 80px;}

  .back{display:inline-block;margin-bottom:16px;font-family:var(--mono);font-size:12px;color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--muted);}

  header{border-bottom:1px solid var(--hair);padding-bottom:20px;margin-bottom:28px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;}

  h1{font-family:var(--serif);font-weight:600;font-size:26px;margin:4px 0 0;}
  .period{font-family:var(--mono);font-size:13px;color:var(--muted);}

  .empty{border:1px dashed var(--hair);border-radius:4px;padding:40px 24px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:13px;}

  .gauges{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--hair);border-radius:4px;overflow:hidden;margin-bottom:4px;}
  .gauge-panel{padding:28px 24px;background:var(--panel);position:relative;}
  .gauge-panel + .gauge-panel{border-left:1px solid var(--hair);}
  .gauge-label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;}
  .gauge-score{font-family:var(--mono);font-size:56px;font-weight:600;line-height:1;}
  .gauge-band{font-family:var(--sans);font-size:14px;margin-top:6px;font-weight:500;}
  .gauge-trend{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px;}
  .arc-wrap{position:absolute;top:24px;right:24px;width:96px;height:96px;}

  .gap-bar{border:1px solid var(--hair);border-top:none;background:var(--panel-alt);padding:16px 24px 20px;text-align:center;margin-bottom:32px;border-radius:0 0 4px 4px;}
  .gap-track{position:relative;height:8px;background:var(--hair);border-radius:4px;margin:14px 0 10px;overflow:hidden;}
  .gap-fill{position:absolute;top:0;height:100%;background:var(--muted);}
  .gap-mid{position:absolute;top:-4px;left:50%;width:1px;height:16px;background:var(--muted);opacity:.5;}
  .gap-label{font-family:var(--mono);font-size:12px;color:var(--muted);}
  .gap-value{font-family:var(--mono);font-weight:600;color:var(--ink);}
  .relationship-note{font-family:var(--serif);font-size:14px;color:var(--paper);margin-top:10px;max-width:640px;margin-left:auto;margin-right:auto;}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:32px;}
  @media (max-width:760px){.cols,.gauges{grid-template-columns:1fr;}}
  .col-title{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--hair);}
  .indicator{padding:11px 0;border-bottom:1px solid var(--hair);}
  .indicator:last-child{border-bottom:none;}
  .ind-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .ind-name{font-size:13px;font-weight:500;}
  .pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;padding:2px 8px;border-radius:10px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;}
  .ind-note{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45;}

  .section{margin-bottom:32px;}
  .section-title{font-family:var(--serif);font-size:16px;font-weight:600;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--hair);}
  .gate-list{list-style:none;margin:0;padding:0;}
  .gate-item{padding:10px 0;border-bottom:1px solid var(--hair);font-size:13px;}
  .gate-item:last-child{border-bottom:none;}
  .gate-item b{font-weight:600;}
  .gate-item .meta{color:var(--muted);font-size:12px;margin-top:3px;}
  .none-note{color:var(--muted);font-size:13px;font-family:var(--mono);}

  .trajectory{font-size:14px;line-height:1.7;color:var(--paper);}

  .event-item{padding:10px 0;border-bottom:1px solid var(--hair);font-size:13px;}
  .event-item:last-child{border-bottom:none;}
  .event-date{font-family:var(--mono);font-size:11px;color:var(--muted);}
  .event-meta{color:var(--muted);font-size:12px;margin-top:3px;}

  .history{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;}
  .history th,.history td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--hair);}
  .history th{color:var(--muted);font-weight:500;text-transform:uppercase;font-size:10.5px;letter-spacing:.06em;}
  .history tr:hover td{background:var(--panel-alt);}

  footer{margin-top:36px;padding-top:20px;border-top:1px solid var(--hair);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted);}
  footer a{color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--muted);}
  footer a:hover{color:var(--ink);}
</style>
</head>

          "severity": "low",
          "novelty": "new",
          "gate_status": "none",
          "evidence_quality": "medium",
          "source_1": "https://www.bloomberg.com/news/articles/2026-08-07/us-treasury-sparks-debate-over-auction-cutbacks-to-temper-yields",
          "source_2": "https://home.treasury.gov/news/press-releases/sb0592",
          "notes": "A discussion/process item, not a concrete policy change; flagged for tracking rather than scored as a material move."
        }
      ],
      "trajectory_note": "The week's dominant story was a broad, multi-source softening in the labor market: the July jobs report showed the first outright monthly payroll decline in some time (-23,000 versus +83,000 expected), compounded by a combined 103,000-job downward revision to May and June, wage growth cooling to its slowest pace since May 2021, and the unemployment rate's dip to 4.1% attributable more to shrinking labor-force participation than to hiring strength. ADP's private-payrolls read (44,000 versus 70,000 expected) corroborated the same direction, while initial jobless claims stayed low and below consensus \u2014 a partial counterpoint. Together this evidence justified a genuine gate crossing on Labor market deterioration from Stable to Warning. Growth momentum told a more mixed story: both ISM Manufacturing (55.6%, highest since May 2022, with its employment sub-index back in expansion after 33 months) and ISM Services (54.1%) surveys pointed to accelerating activity, a genuine positive counterweight to last week's soft GDP print and tariff overhang, though survey data has not yet been confirmed by hard output figures. Financial markets read the weak labor data as reducing the odds of the hawkish Fed hike three governors pushed for in July \u2014 futures-implied September hike odds fell from 57% to roughly 44% \u2014 and reacted accordingly: the VIX eased to a calm ~14.9, the 10-year Treasury yield fell to about 4.65%, broad high-yield credit spreads tightened to roughly 271bps, and equities rallied to fresh highs. This is a case of stress and resilience partially offsetting within the same week rather than moving together: the underlying labor-market weakness is not resolved by a more dovish policy path, so the modest narrowing of the Stress-Resilience Gap (16 to 13) reflects real but partial improvement in financial conditions layered on top of genuine new labor-market softening, not a clean turn in either direction. No new inflation, household-debt, bank-supervisory, or deficit data were released this week (July CPI lands Aug 12, the NY Fed's Q2 household debt report Aug 11), so those indicators carry forward unchanged; a separate institutional item \u2014 the Treasury Borrowing Advisory Committee's Aug 4 discussion of possible long-end auction-size changes amid the growing issuance burden \u2014 is a fiscal-space item to watch but not yet a policy change. No material new China, Eurozone, or EM-debt spillover data landed within this window. Key things to watch next week: the July CPI print and the NY Fed household debt report, both landing Aug 11-12, plus whether this week's labor-market softening is confirmed or reversed by subsequent data.",
      "confidence": "Medium",
      "retrospective_revision": null
    }
  ]
};

const COLOR_MAP = {
  green: "var(--green)", darkgreen: "var(--darkgreen)", yellow: "var(--yellow)",
  amber: "var(--amber)", orange: "var(--orange)", red: "var(--red)"
};

function esc(s){ return (s ?? "").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function arcSVG(score, color){
  const r = 40, cx = 48, cy = 48, circumference = Math.PI * r;
  const pct = Math.max(0, Math.min(100, score)) / 100;
  const dash = circumference * pct;
  return `<svg width="96" height="96" viewBox="0 0 96 96">
    <path d="M 8 48 A 40 40 0 0 1 88 48" fill="none" stroke="var(--hair)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 8 48 A 40 40 0 0 1 88 48" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="${dash.toFixed(1)} ${circumference.toFixed(1)}"/>
  </svg>`;
}

function statusPill(status, arrow){
  const key = (status||"").toLowerCase();
  let bg = "var(--hair)", fg = "var(--muted)";
  if(["severe","depleted"].includes(key)){bg="rgba(201,64,59,.18)";fg="var(--red)";}
  else if(["escalating","weak"].includes(key)){bg="rgba(217,98,43,.18)";fg="var(--orange)";}
  else if(["warning","mixed"].includes(key)){bg="rgba(201,162,39,.18)";fg="var(--yellow)";}
  else if(["stable","strong"].includes(key)){bg="rgba(76,154,106,.18)";fg="var(--green)";}
  else if(["very strong"].includes(key)){bg="rgba(47,107,69,.25)";fg="var(--darkgreen)";}
  return `<span class="pill" style="background:${bg};color:${fg}">${esc(status)} ${esc(arrow||"")}</span>`;
}

function gapInterpretation(gap){
  if(gap > 10) return "Resilience exceeds pressure";
  if(gap >= 0) return "Favorable balance";
  if(gap >= -10) return "Manageable strain";
  if(gap >= -20) return "Dangerous imbalance";
  return "Acute crisis risk";
}

function render(){
  const app = document.getElementById("app");
  const weeks = TRACKER_DATA.weeks || [];
  if(weeks.length === 0){
    app.innerHTML = `
      <a class="back" href="../index.html">&larr; World dashboard</a>
      <header>
        <div><div class="eyebrow">Global Economic Stress &amp; Resilience Tracker</div>
        <h1>No data yet</h1></div>
      </header>
      <div class="empty">This dashboard renders from <code>data.json</code>.<br>
      Run the weekly scheduled task once to populate the first week's entry.</div>`;
    return;
  }

  const latest = weeks[weeks.length - 1];
  const esi = latest.esi, fri = latest.fri;
  const gap = latest.gap;
  const gapPct = Math.max(-50, Math.min(50, gap));
  const gapLeft = 50 + (gapPct < 0 ? gapPct : 0);
  const gapWidth = Math.abs(gapPct);

  app.innerHTML = `
    <a class="back" href="../index.html">&larr; World dashboard</a>
    <header>
      <div>
        <div class="eyebrow">Global Economic Stress &amp; Resilience Tracker</div>
        <h1>Week ${latest.week}, ${latest.year}</h1>
      </div>
      <div class="period">Reporting period: ${esc(latest.start_date)} – ${esc(latest.end_date)}</div>
    </header>

    <div class="gauges">
      <div class="gauge-panel">
        <div class="gauge-label">Economic Stress Index</div>
        <div class="gauge-score" style="color:${COLOR_MAP[esi.color]||'var(--ink)'}">${esi.score}</div>
        <div class="gauge-band" style="color:${COLOR_MAP[esi.color]||'var(--ink)'}">${esc(esi.band)}</div>
        <div class="gauge-trend">${esc(esi.trend_arrow)} ${esi.change > 0 ? "+"+esi.change : esi.change} vs last week</div>
        <div class="arc-wrap">${arcSVG(esi.score, COLOR_MAP[esi.color]||'#888')}</div>
      </div>
      <div class="gauge-panel">
        <div class="gauge-label">Financial Resilience Index</div>
        <div class="gauge-score" style="color:${COLOR_MAP[fri.color]||'var(--ink)'}">${fri.score}</div>
        <div class="gauge-band" style="color:${COLOR_MAP[fri.color]||'var(--ink)'}">${esc(fri.band)}</div>
        <div class="gauge-trend">${esc(fri.trend_arrow)} ${fri.change > 0 ? "+"+fri.change : fri.change} vs last week</div>
        <div class="arc-wrap">${arcSVG(fri.score, COLOR_MAP[fri.color]||'#888')}</div>
      </div>
    </div>

    <div class="gap-bar">
      <div class="gap-label">STRESS-RESILIENCE GAP &nbsp;<span class="gap-value">${gap > 0 ? "+"+gap : gap}</span> — ${esc(latest.gap_interpretation || gapInterpretation(gap))}</div>
      <div class="gap-track">
        <div class="gap-mid"></div>
        <div class="gap-fill" style="left:${gapLeft}%;width:${gapWidth}%;background:${gap < 0 ? 'var(--red)' : 'var(--green)'}"></div>
      </div>
      <div class="relationship-note">${esc(latest.relationship_note)}</div>
    </div>

    <div class="cols">
      <div>
        <div class="col-title">ESI Indicators</div>
        ${esi.indicators.map(i => `
          <div class="indicator">
            <div class="ind-top"><span class="ind-name">${esc(i.name)}</span>${statusPill(i.status, i.arrow)}</div>
            <div class="ind-note">${esc(i.note)}</div>
          </div>`).join("")}
      </div>
      <div>
        <div class="col-title">FRI Indicators</div>
        ${fri.indicators.map(i => `
          <div class="indicator">
            <div class="ind-top"><span class="ind-name">${esc(i.name)}</span>${statusPill(i.status, i.arrow)}</div>
            <div class="ind-note">${esc(i.note)}</div>
          </div>`).join("")}
      </div>
    </div>

    <div class="section">
      <div class="section-title">ESI trigger events crossed</div>
      ${(latest.esi_gates_crossed && latest.esi_gates_crossed.length) ? `<ul class="gate-list">${latest.esi_gates_crossed.map(g => `
        <li class="gate-item"><b>${esc(g.indicator)}</b> — ${esc(g.event)}<div class="meta">${esc(g.why)}</div></li>`).join("")}</ul>`
        : `<div class="none-note">No new ESI gates crossed this week.</div>`}
    </div>

    <div class="section">
      <div class="section-title">FRI trigger events crossed</div>
      ${(latest.fri_gates_crossed && latest.fri_gates_crossed.length) ? `<ul class="gate-list">${latest.fri_gates_crossed.map(g => `
        <li class="gate-item"><b>${esc(g.indicator)}</b> — ${esc(g.event)}<div class="meta">${esc(g.why)}</div></li>`).join("")}</ul>`
        : `<div class="none-note">No new FRI gates crossed this week.</div>`}
    </div>

    <div class="section">
      <div class="section-title">Notable events this week</div>
      ${(latest.event_log && latest.event_log.length) ? latest.event_log.map(e => `
        <div class="event-item">
          <span class="event-date">${esc(e.event_date)}</span> — <b>${esc(e.indicator)}</b>: ${esc(e.description)}
          <div class="event-meta">type: ${esc(e.event_type)} · severity: ${esc(e.severity)} · evidence: ${esc(e.evidence_quality)}</div>
        </div>`).join("") : `<div class="none-note">No notable events logged this week.</div>`}
    </div>

    <div class="section">
      <div class="section-title">90-day trajectory</div>
      <div class="trajectory">${esc(latest.trajectory_note).split("\\n\\n").map(p=>`<p>${p}</p>`).join("")}</div>
    </div>

    <div class="section">
      <div class="section-title">History</div>
      <table class="history">
        <thead><tr><th>Week</th><th>ESI</th><th>FRI</th><th>Gap</th><th>ESI gates</th><th>FRI gates</th><th>Confidence</th></tr></thead>
        <tbody>
          ${weeks.slice().reverse().map(w => `
            <tr>
              <td>${w.week}/${w.year}</td>
              <td style="color:${COLOR_MAP[w.esi.color]||'var(--ink)'}">${w.esi.score}</td>
              <td style="color:${COLOR_MAP[w.fri.color]||'var(--ink)'}">${w.fri.score}</td>
              <td>${w.gap > 0 ? "+"+w.gap : w.gap}</td>
              <td>${(w.esi_gates_crossed||[]).length}/7</td>
              <td>${(w.fri_gates_crossed||[]).length}/7</td>
              <td>${esc(w.confidence)}</td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>

    <footer>
      <span>ESI gates crossed this week: ${(latest.esi_gates_crossed||[]).length}/7. FRI gates crossed this week: ${(latest.fri_gates_crossed||[]).length}/7.</span>
      <span><a href="methodology.html">Methodology &amp; scoring protocol &rarr;</a></span>
      <span>Updated ${esc(latest.end_date)}</span>
    </footer>
  `;
}

render();
</script>
</body>
</html>
