<html lang="en">
<head>

<title>Global Conflict &amp; Coverage Tracker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151b;
    --panel:#1a1e26;
    --panel-alt:#20242e;
    --paper:#eae7df;
    --ink:#e9e7df;
    --muted:#8b8f99;
    --hair:#2c3038;
    --green:#4c9a6a;
    --darkgreen:#2f6b45;
    --yellow:#c9a227;
    --amber:#d98a2b;
    --orange:#d9622b;
    --red:#c9403b;
    --blue:#5b8fd9;
    --serif:"Source Serif 4", Georgia, serif;
    --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
    --sans:"Inter", system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  .wrap{max-width:1080px;margin:0 auto;padding:36px 24px 80px;}

  .back{display:inline-block;margin-bottom:16px;font-family:var(--mono);font-size:12px;color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--muted);}
  .back:hover{color:var(--ink);}
  header{border-bottom:1px solid var(--hair);padding-bottom:20px;margin-bottom:28px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
  h1{font-family:var(--serif);font-weight:600;font-size:26px;margin:4px 0 0;}
  .period{font-family:var(--mono);font-size:13px;color:var(--muted);}

  .empty{border:1px dashed var(--hair);border-radius:4px;padding:40px 24px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:13px;}

  .summary-bar{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--hair);border-radius:4px;overflow:hidden;margin-bottom:20px;}
  .summary-cell{padding:18px 16px;background:var(--panel);text-align:center;}
  .summary-cell + .summary-cell{border-left:1px solid var(--hair);}
  .summary-num{font-family:var(--mono);font-size:30px;font-weight:600;}
  .summary-lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px;}

  .aggregate-note{border:1px dashed var(--hair);border-radius:4px;padding:12px 16px;font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:32px;}

  .section{margin-bottom:32px;}
  .section-title{font-family:var(--serif);font-size:16px;font-weight:600;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--hair);}

  .conflict-row{padding:12px 0;border-bottom:1px solid var(--hair);}
  .conflict-row:last-child{border-bottom:none;}
  .conflict-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .conflict-name{font-size:14px;font-weight:600;}
  .conflict-region{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:8px;font-weight:400;}
  .conflict-score{font-family:var(--mono);font-size:20px;font-weight:600;min-width:44px;text-align:right;}
  .pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;padding:2px 8px;border-radius:10px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;}
  .conflict-note{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45;max-width:760px;}

  .dotplot-row{display:flex;align-items:center;gap:16px;padding:11px 0;border-bottom:1px solid var(--hair);}
  .dotplot-row:last-child{border-bottom:none;}
  .dotplot-label{width:220px;flex-shrink:0;}
  .dotplot-label .conflict-name{display:block;}
  .dotplot-axis{flex:1;min-width:120px;height:30px;position:relative;}
  .dotplot-axis svg{display:block;width:100%;height:100%;overflow:visible;}
  .dotplot-readout{width:130px;flex-shrink:0;text-align:right;font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.5;}
  .dotplot-readout b{color:var(--ink);font-size:14px;}
  .dotplot-legend{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:14px;align-items:center;}
  .dotplot-legend .swatch{display:inline-flex;align-items:center;gap:5px;}
  .legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .legend-ghost{width:9px;height:9px;border-radius:50%;display:inline-block;border:1.5px solid var(--muted);}
  .legend-diamond{width:8px;height:8px;display:inline-block;background:var(--blue);transform:rotate(45deg);}

  .compact-list{border:1px solid var(--hair);border-radius:4px;overflow:hidden;margin-bottom:8px;}
  .compact-row{display:flex;align-items:center;gap:12px;padding:7px 14px;border-bottom:1px solid var(--hair);background:var(--panel);}
  .compact-row:last-child{border-bottom:none;}
  .compact-rank{font-family:var(--mono);font-size:11px;color:var(--muted);width:16px;flex-shrink:0;}
  .compact-name{font-size:12.5px;width:220px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .compact-axis{flex:1;min-width:100px;height:18px;}
  .compact-axis svg{display:block;width:100%;height:100%;overflow:visible;}
  .compact-score{font-family:var(--mono);font-size:12.5px;width:34px;text-align:right;flex-shrink:0;font-weight:600;}
  .compact-cov{font-family:var(--mono);font-size:11px;width:56px;text-align:right;flex-shrink:0;color:var(--blue);}
  .compact-status{width:88px;flex-shrink:0;text-align:right;}
  .compact-caption{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:20px;}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media (max-width:760px){.cols{grid-template-columns:1fr;}.summary-bar{grid-template-columns:repeat(2,1fr);}}
  .gap-item{padding:10px 0;border-bottom:1px solid var(--hair);font-size:13px;}
  .gap-item:last-child{border-bottom:none;}
  .gap-item b{font-weight:600;}
  .gap-value{font-family:var(--mono);font-weight:600;}
  .gap-value.up{color:var(--red);}
  .gap-value.down{color:var(--green);}
  .gap-meta{color:var(--muted);font-size:12px;margin-top:3px;}

  .event-item{padding:10px 0;border-bottom:1px solid var(--hair);font-size:13px;}
  .event-item:last-child{border-bottom:none;}
  .event-date{font-family:var(--mono);font-size:11px;color:var(--muted);}
  .event-meta{color:var(--muted);font-size:12px;margin-top:3px;}

  .trajectory{font-size:14px;line-height:1.7;color:var(--paper);}

  .history{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;}
  .history th,.history td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--hair);}
  .history th{color:var(--muted);font-weight:500;text-transform:uppercase;font-size:10.5px;letter-spacing:.06em;}
  .history tr:hover td{background:var(--panel-alt);}

  footer{margin-top:36px;padding-top:20px;border-top:1px solid var(--hair);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted);}
  footer a{color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--muted);}
  footer a:hover{color:var(--ink);}
</style>
</head>

function esc(s){ return (s ?? "").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function severityColor(score){
  if(score >= 80) return "var(--red)";
  if(score >= 60) return "var(--orange)";
  if(score >= 40) return "var(--amber)";
  if(score >= 20) return "var(--yellow)";
  return "var(--green)";
}

function priorSeverity(weeks, latestIdx, conflictId){
  for(let i = latestIdx - 1; i >= 0; i--){
    const match = (weeks[i].conflicts || []).find(c => c.conflict_id === conflictId);
    if(match) return match.severity.score;
  }
  return null;
}

function dotPlotRowSVG(prior, current, coverage){
  const y = 15;
  const hasPrior = (prior !== null && prior !== undefined && prior !== current);
  const trendColor = !hasPrior ? "var(--hair)" : (current > prior ? "var(--red)" : (current < prior ? "var(--green)" : "var(--hair)"));
  const grid = [0,25,50,75,100].map(x => `<line x1="${x}" y1="4" x2="${x}" y2="26" stroke="var(--hair)" stroke-width="0.5"/>`).join("");
  const baseline = `<line x1="0" y1="${y}" x2="100" y2="${y}" stroke="var(--hair)" stroke-width="0.6"/>`;
  const trendLine = hasPrior ? `<line x1="${prior}" y1="${y}" x2="${current}" y2="${y}" stroke="${trendColor}" stroke-width="1.6"/>` : "";
  const ghost = hasPrior ? `<circle cx="${prior}" cy="${y}" r="3" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.2"/>` : "";
  const currentDot = `<circle cx="${current}" cy="${y}" r="4.2" fill="${severityColor(current)}" stroke="var(--bg)" stroke-width="1"/>`;
  const covDiamond = `<rect x="${coverage-2.6}" y="${y-2.6}" width="5.2" height="5.2" fill="var(--blue)" stroke="var(--bg)" stroke-width="0.8" transform="rotate(45 ${coverage} ${y})"/>`;
  return `<svg viewBox="0 0 100 30" preserveAspectRatio="none">${grid}${baseline}${trendLine}${ghost}${currentDot}${covDiamond}</svg>`;
}

function compactDotSVG(prior, current, coverage){
  const y = 9;
  const hasPrior = (prior !== null && prior !== undefined && prior !== current);
  const trendColor = !hasPrior ? "var(--hair)" : (current > prior ? "var(--red)" : (current < prior ? "var(--green)" : "var(--hair)"));
  const baseline = `<line x1="0" y1="${y}" x2="100" y2="${y}" stroke="var(--hair)" stroke-width="0.6"/>`;
  const trendLine = hasPrior ? `<line x1="${prior}" y1="${y}" x2="${current}" y2="${y}" stroke="${trendColor}" stroke-width="1.4"/>` : "";
  const ghost = hasPrior ? `<circle cx="${prior}" cy="${y}" r="2.4" fill="var(--panel)" stroke="var(--muted)" stroke-width="1"/>` : "";
  const currentDot = `<circle cx="${current}" cy="${y}" r="3.6" fill="${severityColor(current)}" stroke="var(--bg)" stroke-width="0.8"/>`;
  const covDiamond = `<rect x="${coverage-2.2}" y="${y-2.2}" width="4.4" height="4.4" fill="var(--blue)" stroke="var(--bg)" stroke-width="0.6" transform="rotate(45 ${coverage} ${y})"/>`;
  return `<svg viewBox="0 0 100 18" preserveAspectRatio="none">${baseline}${trendLine}${ghost}${currentDot}${covDiamond}</svg>`;
}

function statusPill(status){
  const key = (status||"").toLowerCase();
  let bg = "var(--hair)", fg = "var(--muted)";
  if(["escalating"].includes(key)){bg="rgba(201,64,59,.18)";fg="var(--red)";}
  else if(["emerging"].includes(key)){bg="rgba(217,98,43,.18)";fg="var(--orange)";}
  else if(["stable"].includes(key)){bg="rgba(201,162,39,.18)";fg="var(--yellow)";}
  else if(["de-escalating"].includes(key)){bg="rgba(76,154,106,.18)";fg="var(--green)";}
  else if(["dormant","resolved"].includes(key)){bg="rgba(47,107,69,.25)";fg="var(--darkgreen)";}
  return `<span class="pill" style="background:${bg};color:${fg}">${esc(status)}</span>`;
}

      <div class="section">
        <div class="section-title">Most overreported relative to severity</div>
        ${(latest.overreported && latest.overreported.length) ? latest.overreported.map(o => `
          <div class="gap-item">
            <b>${esc(nameOf(o.conflict_id))}</b> — severity rank ${o.severity_rank}, coverage rank ${o.coverage_rank}, gap <span class="gap-value down">${o.gap}</span>
            <div class="gap-meta">${esc(o.reason)}</div>
          </div>`).join("") : `<div class="gap-meta">No notable overreported gaps this week.</div>`}
      </div>
    </div>

    <div class="section">
      <div class="section-title">Notable events this week</div>
      ${(latest.notable_events && latest.notable_events.length) ? latest.notable_events.map(e => `
        <div class="event-item">
          <span class="event-date">${esc(e.event_date)}</span> — <b>${esc(nameOf(e.conflict_id))}</b>: ${esc(e.action)}
          <div class="event-meta">${esc(e.actor)} → ${esc(e.target)} · effect: ${esc(e.effect)} · confidence: ${esc(e.confidence)}</div>
        </div>`).join("") : `<div class="gap-meta">No notable events logged this week.</div>`}
    </div>

    <div class="section">
      <div class="section-title">90-day trajectory</div>
      <div class="trajectory">${esc(latest.trajectory_note).split("\\n\\n").map(p=>`<p>${p}</p>`).join("")}</div>
    </div>

    <div class="section">
      <div class="section-title">History</div>
      <table class="history">
        <thead><tr><th>Week</th><th>Active</th><th>Emerging</th><th>Escalating</th><th>De-escalating</th><th>Confidence</th></tr></thead>
        <tbody>
          ${weeks.slice().reverse().map(w => `
            <tr>
              <td>${w.week}/${w.year}</td>
              <td>${(w.summary||{}).active ?? 0}</td>
              <td>${(w.summary||{}).emerging ?? 0}</td>
              <td>${((w.summary||{}).escalating_ids||[]).length}</td>
              <td>${((w.summary||{}).de_escalating_ids||[]).length}</td>
              <td>${esc(w.confidence)}</td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>

    <footer>
      <span>${sortedConflicts.length} conflicts tracked this week.</span>
      <span><a href="methodology.html">Methodology &amp; scoring protocol &rarr;</a></span>
      <span>Updated ${esc(latest.end_date)}</span>
    </footer>
  `;
}

render();
</script>
</body>
</html>
